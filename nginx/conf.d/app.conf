# ===========================================================================
# app.conf — comportement des adresses servies par nginx
# ---------------------------------------------------------------------------
# RÔLE DU FICHIER
# Ce fichier est inclus depuis le bloc « http » de nginx.conf. Il ne décrit que
# ce qui concerne les ADRESSES : quelles routes existent, ce qu'elles
# renvoient, quelles règles de cache et de sécurité s'appliquent.
#
# Les réglages généraux (nombre d'ouvriers, journaux, chemins temporaires)
# sont dans nginx.conf, pas ici. Répartir les deux niveaux évite qu'un même
# réglage soit défini à deux endroits.
#
# ROUTES DÉFINIES PAR CE FICHIER
#   /api/infos : réponse JSON minimale, sans code serveur
#   /healthz   : oracle de santé interrogé par Docker
#   /          : service des fichiers statiques
#   *          : page d'erreur 404 personnalisée
#
# NOM DU FICHIER
# Il s'appelle app.conf et non default.conf : le Dockerfile supprime le fichier
# par défaut de l'image officielle. On conserve ainsi une configuration unique
# et lisible, au lieu de superposer plusieurs fragments dont on ne sait plus
# lequel l'emporte.
# ===========================================================================

# ---------------------------------------------------------------------------
# Serveur unique du laboratoire
# ---------------------------------------------------------------------------
# Un conteneur = un serveur = un rôle. Déclarer un bloc server par nom de
# domaine n'a de sens que pour héberger plusieurs sites sur une même adresse
# IP, ce qui n'est pas le cas ici.
server {
    # PORT 8080 ET NON 80 — pourquoi ?
    # Un processus non privilégié ne peut pas ouvrir un port inférieur à 1024 :
    # ces ports sont réservés par le système, et les ouvrir exige une
    # élévation de privilèges. Notre conteneur fonctionne donc en utilisateur
    # « nginx », sur un port haut, ce qui est nettement plus sûr : une
    # intrusion dans le conteneur ne donne aucun accès au réseau de la machine
    # hôte. La publication vers l'extérieur se fait par « docker run -p »,
    # côté démon, et non par le processus lui-même.
    listen 8080;

    # Nom de serveur : le caractère de remplacement underscore signifie
    # « tout nom qui ne correspond à aucun autre bloc server ». Comme il n'y a
    # qu'un seul bloc, c'est la valeur correcte et explicite.
    server_name _;

    # Racine du site : chemin À L'INTÉRIEUR de l'image. Les fichiers y ont été
    # copiés par le Dockerfile.
    root /usr/share/nginx/html;

    # Fichier renvoyé pour la requête « / ».
    index index.html;

    # ------------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------------
    # gzip ne compresse QUE les formats texte. Compresser une image déjà
    # compressée (PNG, JPEG, WebP) est inutile et coûte du temps processeur :
    # le format ne gagne presque rien, alors que le temps est réel.
    #
    # gzip_vary on ajoute un en-tête Vary: Accept-Encoding : c'est ce qui
    # indique aux caches intermédiaires qu'un client et un autre, pour la même
    # adresse, reçoivent des réponses différentes.
    gzip            on;
    gzip_comp_level 5;      # compromis entre taille obtenue et coût CPU
    gzip_min_length 1024;   # sous 1 Kio (kibioctet), l'en-tête coûte plus cher que le gain
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types      text/plain
                    text/css
                    text/javascript
                    application/javascript
                    application/json
                    image/svg+xml;

    # ------------------------------------------------------------------------
    # En-têtes de sécurité
    # ------------------------------------------------------------------------
    # PIEGE MAJEUR À CONNAITRE
    # Dans nginx, un « add_header » déclaré dans un bloc enfant REMPLACE
    # entièrement ceux du bloc parent ; il ne s'y ajoute pas. Il faut donc
    # redéclarer les en-têtes dans chaque bloc qui en a besoin. On le verra
    # plus bas, dans la règle par défaut.
    #
    # « always » étend l'envoi de l'en-tête aux réponses d'erreur (4xx, 5xx).
    # Sans lui, un navigateur n'accompagnerait pas la page 404 de l'en-tête
    # de sécurité — c'est-à-dire que la protection s'arrêterait juste quand
    # elle compte le plus.

    # X-Content-Type-Options : interdit au navigateur de deviner un type MIME.
    # Réduit le risque qu'un fichier soit interprété dans un contexte non
    # prévu (défaut de conception connu sous le nom de « confusion de type »).
    add_header X-Content-Type-Options "nosniff" always;

    # X-Frame-Options : interdit l'affichage du site dans une iframe tierce.
    # Empêche le « clic détourné » (en anglais : clickjacking), où un site
    # superpose une page invisible pour recueillir un clic volontaire.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer-Policy : limite l'information transmise aux autres sites dans
    # l'en-tête Referer. « strict-origin-when-cross-origin » ne transmet le
    # domaine que lors d'un changement d'origine : le strict nécessaire.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------------
    # Oracle de santé : /healthz
    # ------------------------------------------------------------------------
    # Docker interroge cette route périoriquement (voir HEALTHCHECK dans le
    # Dockerfile) pour savoir si le conteneur répond encore.
    #
    # Critère pédagogique : un service dépourvu d'oracle de santé est un
    # service que personne ne peut surveiller. On ne se contente pas de
    # constater que le processus existe : on vérifie qu'il RÉPOND.
    #
    # « = » (au lieu d'un espace) impose une correspondance EXACTE. Avec un
    # espace, la règle vaudrait aussi pour /healthz/anything.
    location = /healthz {
        # access_log off : cette route est appelée toutes les 30 secondes. La
        # journaliser noierait les journaux réels sous du bruit inutile.
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------------
    # Mini-API JSON : /api/infos
    # ------------------------------------------------------------------------
    # Démonstration : nginx produit du JSON sans qu'une seule ligne de langage
    # serveur ait été écrite, grâce à la directive « return ». Utile pour
    # comprendre qu'un serveur web ne se limite pas au service de fichiers.
    location = /api/infos {
        default_type application/json;

        # Les en-têtes de sécurité sont redéclarés ici. Une réponse produite
        # par « return » ne suit pas le chemin de gestion d'un fichier sur
        # disque : les « add_header » du bloc serveur ne sont pas appliqués
        # automatiquement. Un détail qui se constate en examinant la réponse
        # dans l'outil de développement du navigateur.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # no-store : la réponse ne doit jamais être conservée. Elle décrit un
        # état ponctuel, l'enregistrer n'aurait aucun sens.
        add_header Cache-Control "no-store" always;

        # 200 = succès. Le corps est une chaîne JSON littérale.
        return 200 '{"serveur":"nginx","role":"page statique + api minimale","conteneur":"non-root","dependances-front":"aucune"}';
    }

    # ------------------------------------------------------------------------
    # Ressources statiques : /assets/
    # ------------------------------------------------------------------------
    location /assets/ {
        # « $uri » est l'adresse demandée, complétée par « root ».
        # try_files les essaie dans l'ordre ; si aucun ne correspond à un
        # FICHIER existant, « =404 » renvoie la page d'erreur.
        #
        # Sans cette ligne, un fichier absent renverrait le fichier
        # index.html avec un code 200 : une page d'accueil servie à la place
        # d'une feuille de style manquante. Le résultat est un site vide, sans
        # la moindre erreur visible dans le journal du navigateur. L'option
        # « =404 » transforme ce silence trompeur en erreur explicite.
        try_files $uri =404;

        # « expires » ajoute un en-tête Expires ET un Cache-Control
        # max-age. Un fichier portant un nom de version (app-v2.css) peut être
        # conservé 30 jours : le navigateur ne demandera même pas s'il a
        # changé. Un déploiement ultérieur invalide ce cache en changeant le
        # nom du fichier, pas en vidant le cache.
        expires 30d;

        # On n'ajoute PAS d'en-tête CORS : la page et ses ressources sont
        # servies depuis la même origine, aucun partage entre origines n'est
        # nécessaire. On n'ouvre pas ce que l'on n'utilise pas.
    }

    # ------------------------------------------------------------------------
    # Page d'entrée
    # ------------------------------------------------------------------------
    # Cet index ne doit jamais être mis en cache longtemps : c'est lui qui
    # référence les ressources versionnées. S'il était conservé 30 jours, un
    # déploiement resterait invisible jusqu'à l'expiration.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        # Les en-têtes de sécurité doivent être REDÉCLARÉS : dès qu'un bloc
        # contient un « add_header », ceux du bloc serveur sont écartés. Cette
        # règle a été vérifiée par la commande :
        #   curl -I http://127.0.0.1:8080/
        # qui affichait bien les en-têtes pour /assets/ mais pas pour la page
        # d'accueil. C'est le genre de défaut qui ne produit aucun message
        # d'erreur et se découvre seulement en inspectant les en-têtes.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------------
    # Règle par défaut
    # ------------------------------------------------------------------------
    location / {
        # Ordre de résolution :
        #   $uri  : le fichier demandé (/a/b.html) ;
        #   $uri/ : le même nom, mais comme répertoire ;
        #   =404  : sinon, page d'erreur, avec le bon code de retour.
        #
        # CHOIX DÉLIBÉRÉ : « =404 », et NON « /index.html ».
        # Servir l'accueil pour TOUTE adresse inconnue est le comportement des
        # applications à page unique (en anglais : Single Page Application),
        # où le routeur JavaScript lit l'adresse et affiche le bon écran. Ce
        # laboratoire est un site statique : il n'a pas de routeur. Avec
        # « /index.html », l'adresse /fichier-typo.css renverrait l'accueil
        # avec un code 200 — une fausse succès, invisible côté navigateur.
        # Le code 404 est le seul signal honnête.
        try_files $uri $uri/ =404;

        # Les en-têtes de sécurité sont redéclarés : un « add_header » dans
        # un bloc enfant remplace ceux du parent (voir le piège signalé plus
        # haut). Leur omission ici laisserait la page d'accueil sans aucune
        # protection, sans le moindre message d'erreur.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------------
    # Page d'erreur 404
    # ------------------------------------------------------------------------
    error_page 404 /erreurs/404.html;

    location = /erreurs/404.html {
        # « internal » interdit l'accès DIRECT à cette adresse. Elle reste
        # accessible au seul usage interne de error_page.
        #
        # Le dernier paramètre de error_page n'est volontairement PAS vide :
        # il indique que la réponse d'erreur a été traitée en interne. Écrire
        # « error_page 404 /erreurs/404.html ; » sans valeur de remplacement
        # ferait partir nginx dans une nouvelle requête réseau vers sa propre
        # adresse, boucle qui se solderait par un échec silencieux.
        internal;

        add_header Cache-Control "no-store" always;
    }
}
