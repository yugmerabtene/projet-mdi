# ===========================================================================
# nginx.conf — configuration principale du serveur nginx
# ---------------------------------------------------------------------------
# RÔLE DU FICHIER
# Ce fichier remplace intégralement le nginx.conf livré dans l'image
# officielle. Il est donc l'unique source de vérité du serveur : plus aucun
# réglage n'est hérité d'une configuration tierce qu'on ne maîtrise pas.
#
# POURQUOI REMPLACER PLUTÔT QUE COMPLÉTER ?
# L'image officielle contient un bloc « user nginx ; » et un chemin de fichier
# d'identifiant situé dans /run. Ces deux réglages sont incompatibles avec un
# conteneur exécuté sans privilège et en lecture seule. Compléter la
# configuration ne suffirait pas : il faudrait neutraliser l'original, ce qui
# est fragile. Le remplacer supprime le problème à la racine.
#
# STRUCTURE D'UNE CONFIGURATION NGINX
# Trois contextes, imbriqués, du plus général au plus précis :
#
#   1. le contexte PRINCIPAL  (ce fichier, en dehors de tout bloc)
#      → le processus lui-même : nombre d'ouvriers, journaux, fichier
#        d'identifiant.
#   2. le contexte HTTP        (bloc http { … })
#      → la manière de traiter les échanges : formats, cache, journaux,
#        chemins temporaires, et les serveurs.
#   3. le contexte SERVEUR    (bloc server { … }, dans conf.d/app.conf)
#      → le comportement d'une adresse donnée.
#
# Chaque niveau hérite du précédent et peut le surcharger. C'est ce qui rend
# nginx à la fois puissant et piégeux : une directive déclarée au mauvais
# niveau n'est pas ignorée, elle agit ailleurs.
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. CONTEXTE PRINCIPAL
# ---------------------------------------------------------------------------

# --- Nombre de processus de traitement des requêtes ------------------------
# « auto » = un ouvrier par cœur de processeur disponible. Chaque ouvrier
# gère une partie des connexions, en lectures et écritures non bloquantes.
# Réserver ce nombre coûte peu ; à l'inverse, on plafonne à l'unité pour
# éviter de créer des dizaines d'ouvriers sur un serveur peu sollicité.
worker_processes auto;

# --- Fichier d'identifiant du processus maître -----------------------------
# Par défaut, nginx écrit ce fichier dans /run, un répertoire inscriptible
# uniquement par root. Notre conteneur tourne en lecture seule et sans
# privilège : l'écriture échouerait, et le serveur refuserait de démarrer.
#
# On le place donc dans /tmp/nginx, le SEUL emplacement à la fois inscriptible
# et monté en mémoire vive par compose.yaml. Attention : il ne suffit pas
# d'écrire /tmp, car /tmp lui-même n'est pas monté en tmpfs et reste en
# lecture seule sous l'option read_only. Le chemin doit être celui du montage.
#
# Ce chemin est un paramètre de construction, pas une constante : si l'on
# change le montage, il faut changer ce réglage, sinon le conteneur échoue au
# démarrage. Un service qui ne démarre pas est un service facile à diagnostiquer ;
# un service qui démarre avec la mauvaise configuration ne l'est pas.
pid /tmp/nginx/nginx.pid;

# --- Journal d'erreurs global ----------------------------------------------
# /dev/stderr est le canal d'erreur du processus, celui que Docker collecte
# dans « docker logs ». Écrire dans un fichier classique obligerait à configurer
# un pilote de collecte ; écrire sur la sortie d'erreur suffit et reste
# lisible par l'utilisateur, lisible par « docker logs », collectable par
# n'importe quel agrégateur de journaux.
error_log /dev/stderr warn;

# ---------------------------------------------------------------------------
# 2. CONTEXTE ÉVÉNEMENTS
# ---------------------------------------------------------------------------
# Ce bloc ne gère PAS les requêtes : il gère la manière dont le noyau notifie
# les descripteurs de fichiers devenant actifs. En pratique, on n'écrit presque
# rien ici : on se contente de régler les limites.

events {
    # Nombre maximal de connexions simultanées PAR OUVRIER. Le total maximal
    # est ce produit, multiplié par le nombre d'ouvriers. Une valeur trop
    # basse ne provoque pas une erreur, mais des connexions rejetées : le
    # symptôme apparaît côté client, ce qui rend le diagnostic plus difficile.
    worker_connections 1024;
}

# ---------------------------------------------------------------------------
# 3. CONTEXTE HTTP
# ---------------------------------------------------------------------------
http {

    # --- Types MIME -------------------------------------------------------
    # Table qui associe une extension de nom de fichier à un type MIME.
    # Sans elle, un navigateur reçoit « text/html » pour TOUT fichier et
    # refuse d'appliquer une feuille de style. On inclut la table standard,
    # on ne la réécrit pas.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Les fichiers de ce laboratoire sont encodés en UTF-8. Cette directive
    # ajoute « charset=utf-8 » à l'en-tête Content-Type, si bien que le
    # navigateur interprète correctement les accents, même si la balise
    # <meta charset> du document était absente.
    charset utf-8;

    # --- Journaux d'accès --------------------------------------------------
    # L'écriture directe sur la sortie standard et sur la sortie d'erreur
    # supprime toute gestion de fichiers journaux rotatifs : on n'a plus à
    # choisir une taille maximale, un nombre de fichiers, ni à craindre qu'un
    # disque plein interrompe le service. C'est le modèle « journaux, mesures
    # et traces » : la collecte est extérieure au processus, elle n'est plus
    # gérée par lui.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Performance réseau -------------------------------------------------
    # sendfile on : le noyau copie directement le fichier vers la socket,
    # sans faire transiter les données par l'espace mémoire du processus. On
    # économise une copie complète du contenu à chaque requête.
    sendfile      on;

    # tcp_nopush on : envoie les en-têtes réseau en un seul paquet, ce qui
    # réduit le nombre d'allers-retours lors de l'envoi d'un fichier entier.
    tcp_nopush    on;

    # keepalive_timeout : durée pendant laquelle une connexion reste ouverte
    # en attente de la requête suivante, au lieu d'être refermée puis
    # rouverte. 65 secondes est la valeur recommandée par la documentation
    # nginx, car elle couvre exactement la durée d'inactivité retenue par les
    # proxys et les pare-feu en amont.
    keepalive_timeout 65;

    # server_tokens off : n'expose plus la version exacte de nginx dans les
    # en-têtes d'erreur et la page d'erreur par défaut. Réduire l'information
    # accordée à un attaquant est une mesure de défense valable, même si elle
    # ne remplace pas la mise à jour du logiciel.
    server_tokens off;

    # --- Chemins d'écriture temporaires -------------------------------------
    # nginx dépose des fichiers intermédiaires (corps de requête reçu, réponse
    # en cours d'envoi, corps relayé). Les chemins par défaut visent
    # /var/cache/nginx, que l'utilisateur nginx ne peut pas écrire : le
    # démarrage échouerait. On les redirige vers /tmp, seul emplacement
    # inscriptible, et monté en mémoire vive dans compose.yaml.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # --- Configuration des serveurs ------------------------------------------
    # Tout fichier .conf de ce dossier est inclus. Le nom du fichier définit
    # l'ordre de lecture (ordre alphabétique), ce qui rend les dépendances
    # entre serveurs explicites et prévisibles.
    include /etc/nginx/conf.d/*.conf;
}
