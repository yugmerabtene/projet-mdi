# ===========================================================================
# 000-default.conf — hôte virtuel Apache pour Moodle
# ---------------------------------------------------------------------------
# RÔLE DU FICHIER
# Ce fichier remplace la configuration livrée dans l'image de base. Il dit à
# Apache deux choses : où se trouvent les pages, et qui a le droit d'y accéder.
#
# POURQUOI REMPLACER PLUTÔT QU'AJOUTER
# L'image officielle active un site nommé 000-default, qui sert /var/www/html
# et écoute sur le port 80. Ajouter un second site produirait deux blocs
# « VirtualHost » se disputant le même port et le même DocumentRoot : le
# comportement deviendrait dépendant de l'ordre de chargement des fichiers, ce
# qui est exactement le piège décrit dans le premier laboratoire. Un seul site,
# écrit au bon endroit.
# ===========================================================================

# --------------------------------------------------------------------------
# Nom du serveur, déclaré une fois pour toutes
# --------------------------------------------------------------------------
# Sans ServerName, Apache cherche à déterminer son propre nom à partir de
# l'adresse IP du conteneur, et il échoue en affichant deux fois un avertissement
# AH00558 au démarrage. Sans gravité, mais deux fois par démarrage, sur la
# console de l'étudiant : le bruit masque les vrais messages, qui sont ceux du
# script d'entrée.
#
# La valeur n'est pas « localhost » par hasard. Apache ne fait ici aucun
# traitement de nom : ServerName sert seulement à supprimer l'avertissement et à
# servir de nom par défaut dans les messages d'erreur. Moodle, lui, se base sur
# son propre réglage, l'adresse publique déclarée dans le fichier .env.
ServerName localhost

# --------------------------------------------------------------------------
# Bloc principal
# --------------------------------------------------------------------------
# « *:80 » signifie : toutes les interfaces du conteneur, port 80.
#
# L'étoile n'expose rien sur la machine du développeur : elle décrit ce que le
# serveur écoute DANS le conteneur. La publication sur la machine hôte se fait
# uniquement par la clé « ports » du fichier Compose. Confondre les deux est une
# erreur fréquente et grave : un « *:80 » publié sur l'hôte expose la
# plateforme à tout le réseau.
<VirtualHost *:80>

    # Racine des pages. Elle correspond EXACTEMENT à l'emplacement du code
    # Moodle déposé par le Dockerfile (/srv/moodle).
    DocumentRoot /srv/moodle

    # Consignes d'accès à la racine.
    #   Require all granted : le site est accessible, y compris depuis le
    #                          réseau du laboratoire. C'est voulu ici : la
    #                          plateforme doit être visible depuis le poste de
    #                          l'étudiant. La restriction à la boucle locale
    #                          est assurée par le port publié, pas par Apache.
    #   Options -Indexes    : INTERDIT la liste des fichiers d'un répertoire.
    #                          Sans cette option, n'importe qui peut parcourir
    #                          /backup/ et y découvrir les archives de
    #                          sauvegarde du laboratoire. C'est la directive
    #                          la plus utile de tout le fichier.
    #   AllowOverride None  : les fichiers .htaccess du dépôt ne sont pas
    #                          pris en compte. Une configuration définie dans
    #                          l'image ne peut donc pas être contournée par un
    #                          fichier déposé en amont.
    <Directory /srv/moodle>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Interdiction explicite, appliquée au niveau de l'hôte virtuel.
    # Les fichiers de configuration de Moodle décrivent la base de données et
    # les clés de signature ; les fichiers .log et .bak peuvent contenir des
    # traces d'exécution. On refuse leur accès au niveau du serveur, sans
    # dépendre d'un réglage propre à Moodle.
    <FilesMatch "^(config\.php|config-dist\.php|composer\.(json|lock)|\.env|.*\.log|.*\.bak)$">
        Require all denied
    </FilesMatch>

    # ----------------------------------------------------------------------
    # Journalisation
    # ----------------------------------------------------------------------
    # Les journaux partent vers les sorties standard du conteneur, que
    # « docker compose logs » affiche. Aucun fichier de journal n'est créé
    # dans le conteneur : c'est ce qui permet de lire le journal complet après
    # un redémarrage, alors qu'un fichier aurait disparu avec le conteneur.
    #
    # « combined » ajoute l'agent utilisateur et le temps de réponse à chaque
    # ligne, ce qui est indispensable pour distinguer un page lente d'une page
    # en erreur.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # ----------------------------------------------------------------------
    # En-têtes de sécurité posés par Apache
    # ----------------------------------------------------------------------
    # Moodle pose lui-même ces en-têtes lorsqu'il est correctement installé.
    # On les pose ici en amont, pour que la sécurité soit effective dès le
    # premier démarrage, avant même la fin de l'installation.
    #
    # X-Frame-Options : interdit d'afficher Moodle dans le cadre d'un autre
    # site. C'est la protection de référence contre le clic détourné, où un
    # attaquant fait cliquer un utilisateur sur un bouton invisible.
    #
    # X-Content-Type-Options : interdit au navigateur de deviner un type MIME.
    # Sans cet en-tête, un fichier déposé en PNG mais contenant du script peut
    # être exécuté dans certains navigateurs.
    #
    # Referrer-Policy : n'envoie plus l'adresse de Moodle vers les sites
    # externes. Un cours qui lie une ressource tierce ne révèle plus ainsi
    # l'adresse de sa plateforme.
    #
    # NOTA : on ne pose PAS Strict-Transport-Security ici. Cet en-tête n'a de
    # sens que sur une connexion chiffrée, et le laboratoire sert du HTTP en
    # boucle locale. Le poser ici n'aurait aucun effet et donnerait l'illusion
    # d'une protection.
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ----------------------------------------------------------------------
    # Compression
    # ----------------------------------------------------------------------
    # Les fichiers texte (HTML, CSS, JavaScript) pèsent plusieurs centaines de
    # kilo-octets et se compressent de 70 à 80 %. La négociation est automatique
    # : Apache ne renvoie la version compressée que si le navigateur annonce
    # savoir la lire.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json image/svg+xml
    </IfModule>

    # MIME types : évite qu'Apache devine le type d'un fichier. Le module est
    # activé par l'image de base ; ce bloc sert à rappeler que le comportement
    # repose sur des types explicites, jamais sur des extensions devinées.
    <IfModule mod_mime.c>
        AddType application/javascript .js
        AddType image/svg+xml .svg
    </IfModule>

</VirtualHost>
