; ==========================================================================
; zz-laboratoire.ini — réglages PHP du serveur Moodle
; --------------------------------------------------------------------------
; RÔLE DU FICHIER
; L'image officielle PHP se règle avec des fichiers .ini déposés dans
; /usr/local/etc/php/conf.d/. Tous les fichiers de ce répertoire sont lus dans
; l'ordre alphabétique, au démarrage de chaque processus PHP. Le nom « zz- »
; place donc ce fichier en dernier : en cas de contradiction, la dernière
; valeur lue l'emporte, et c'est bien la nôtre qui doit gagner.
;
; LE PRINCIPE : UN RÉGLAGE SANS MOTIF EST UNE DÉFAUT
; Chaque ligne porte ici la raison du réglage, jamais la raison évidente. La
; valeur se lit dans la ligne ; son motif ne se lit nulle part ailleurs. Une
; valeur isolée dans un fichier de configuration est une énigme pour le
; lecteur six mois plus tard.
; ==========================================================================

; --------------------------------------------------------------------------
; Sécurité
; --------------------------------------------------------------------------

; Ne pas afficher la version de PHP dans les en-têtes HTTP. Elle facilite le
; repérage des versions vulnérables, et n'apporte rien à l'exploitant.
expose_php = Off

; Interdire l'exécution de scripts dans les dossiers de fichiers déposés.
; Moodle active ce réglage lui-même à l'installation ; on le pose ici pour que
; la plateforme soit protégée dès le premier démarrage, avant même que
; l'installeur ait eu le temps de passer.
allow_url_include = Off

; Les cookies de session ne sont pas accessibles au Javascript d'une page
; tierce. httponly protège le cookie de session ; samesite=Lax complète la
; protection contre le rejeu de cookie depuis un autre site.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Les sessions sont stockées sur le disque. On borne leur durée et on évite de
; les faire grossir indéfiniment si un client ferme mal son navigateur.
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 100

; --------------------------------------------------------------------------
; Ressources
; --------------------------------------------------------------------------

; Moodle charge beaucoup de ressources au premier démarrage (thèmes,
; bibliothèques JavaScript, définitions de cours). La valeur par défaut de
; 128 Mio est
; insuffisante sur un poste de laboratoire : l'écran « Allowed memory size
; exhausted » apparaît alors pendant l'installation, sans autre explication.
memory_limit = 512M

; Nombre de variables acceptées dans un formulaire. Moodle dépasse la valeur
; par défaut de 1000 sur les écrans de réglages d'un cours, et les modifications
; sont alors silencieusement perdues. La valeur recommandée par Moodle est
; 5000.
max_input_vars = 5000

; Taille maximale d'un fichier déposé et d'un corps de requête. Ces deux
; valeurs doivent rester cohérentes : un fichier plus gros que post_max_size
; est refusé, même si upload_max_filesize l'autoriserait.
; 64 Mio est largement suffisant pour un cours de laboratoire, et borne les
; conséquences d'un envoi massif en mémoire.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Durée maximale d'exécution d'un script. La valeur par défaut (30 s) suffit
; pour une page web, pas pour une tâche qui reconstruit le cache de plusieurs
; milliers de ressources.
max_execution_time = 300

; --------------------------------------------------------------------------
; Cache des pages compilées (opcache)
; --------------------------------------------------------------------------
; PHP compile chaque page PHP en code machine à chaque requête. Ce cache
; conserve le résultat en mémoire : c'est le premier levier de performance,
; et Moodle affiche un avertissement explicite sur son tableau de bord quand
; il est absent ou mal réglé.

; Activation.
opcache.enable = 1

; Mémoire allouée au cache, en mégaoctets. La valeur par défaut de 128 Mio est
; insuffisante pour Moodle, dont le nombre de fichiers compilés est élevé.
opcache.memory_consumption = 256

; Nombre maximal de fichiers compilés conservés en mémoire. Moodle exige au
; minimum 20000 ; en dessous, le cache se vide en permanence et perd tout
; intérêt : PHP recompile sans arrêt, pour un gain nul.
opcache.max_accelerated_files = 30000

; Réévaluer l'horodatage des fichiers toutes les 5 secondes. En laboratoire,
; l'étudiant modifie le code et veut voir le résultat tout de suite. En
; production, on mettrait 0 : personne ne modifie Moodle à l'exécution, et
; l'économie d'appels système est réelle.
opcache.revalidate_freq = 5

; --------------------------------------------------------------------------
; Divers
; --------------------------------------------------------------------------

; Fuseau horaire. Moodle stocke les dates en temps universel et les affiche
; dans le fuseau du site, réglé dans l'interface. PHP n'intervient qu'à titre
; provisionnel, avant que Moodle n'ait son propre réglage.
date.timezone = UTC

; Journalisation des erreurs vers la sortie d'erreur du conteneur. Sans ce
; réglage, PHP écrit dans le fichier php_errors.log situé dans /var/log, que
; « docker compose logs » n'affiche jamais : l'erreur est donc invisible, ce
; qui est la pire façon de perdre du temps.
log_errors = On
display_errors = Off
